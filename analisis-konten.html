  const rows = [...c.vs].sort((a, b) => (a[sortK] > b[sortK] ? 1 : a[sortK] < b[sortK] ? -1 : 0) * sortD);
  $("#mb").innerHTML = `<table><thead><tr>${cols.map(([k, l]) => `<th data-s="${k}" class="${["c","r","roi","o","ctr","v6"].includes(k) ? "num" : ""}">${l}${sortK === k ? (sortD < 0 ? " ▼" : " ▲") : ""}</th>`).join("")}</tr></thead><tbody>
   ${rows.map(v => `<tr><td><a class="lnk" href="${link(v)}" target="_blank" rel="noopener">@${esc(v.u)}</a></td><td>${esc(v.t)}</td><td>${esc(v.p)}</td><td class="num">${rb(v.c)}</td><td class="num">${rb(v.r)}</td><td class="num" style="${v.c >= D.costMin && v.roi < 2 ? "color:var(--bad);font-weight:700" : ""}">${x2(v.roi)}</td><td class="num">${num(v.o)}</td><td class="num">${pc1(v.ctr)}</td><td class="num">${pc1(v.v6)}</td><td>${v.win ? '<span class="win-y">✓</span>' : ""}</td></tr>`).join("")}</tbody></table>`;
  $("#mb").querySelectorAll("th[data-s]").forEach(th => th.onclick = () => { const k = th.dataset.s; sortD = sortK === k ? -sortD : -1; sortK = k; drawAll(); }); }
const closeM = () => $("#mdl").classList.remove("on");
$("#mx").onclick = closeM; $("#mdl").addEventListener("click", e => { if (e.target.id === "mdl") closeM(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeM(); });
document.addEventListener("click", e => { if (e.target.closest("[data-modal]")) openAll(); });
// ---------- modal: putar video winning ----------
const closeV = () => { $("#vm").classList.remove("on"); $("#vf").src = "about:blank"; };
document.addEventListener("click", e => { const b = e.target.closest("[data-play]"); if (!b) return;
  $("#vt").textContent = b.dataset.who; $("#vs").textContent = b.dataset.pf + " · video affiliate winning";
  $("#vf").src = "https://drive.google.com/file/d/" + b.dataset.play + "/preview"; $("#vm").classList.add("on"); });
$("#vx").onclick = closeV; $("#vm").addEventListener("click", e => { if (e.target.id === "vm") closeV(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeV(); });

// ---------- navigasi ----------
const N = SL.length; let at = 0;
function render(){ $("#main").innerHTML = SL.map((s, i) => `<section class="s" id="s${i}">${s.html()}</section>`).join("");
  $("#dots").innerHTML = SL.map((s, i) => `<button data-go="${i}">${i + 1} · ${s.t}</button>`).join(""); go(at, true); }
function go(i, keep){ at = Math.max(0, Math.min(N - 1, i));
  const sec = document.getElementById("s" + at); if (!keep) sec.innerHTML = SL[at].html();
  document.querySelectorAll(".s").forEach((el, j) => el.classList.toggle("on", j === at));
  if (SL[at].draw) SL[at].draw();
  document.querySelectorAll("#dots button").forEach((b, j) => { b.classList.toggle("on", j === at); b.classList.toggle("done", j < at); });
  const on = $("#dots button.on"); on && on.scrollIntoView({inline:"center", block:"nearest"});
  $("#bar").style.width = ((at + 1) / N * 100) + "%"; $("#count").textContent = `${at + 1} / ${N}`;
  $("#prev").disabled = at === 0; $("#next").disabled = at === N - 1; history.replaceState(null, "", "#" + (at + 1)); window.scrollTo({top:0, behavior:"instant"}); }
$("#wk").onchange = e => { wi = +e.target.value; render(); };
document.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if (g) return go(+g.dataset.go); if (e.target.id === "prev") go(at - 1); if (e.target.id === "next") go(at + 1); });
document.addEventListener("keydown", e => { if (e.target.tagName === "SELECT" || $("#mdl").classList.contains("on")) return; if (e.key === "ArrowRight") go(at + 1); if (e.key === "ArrowLeft") go(at - 1); });
window.addEventListener("hashchange", () => { const k = parseInt(location.hash.slice(1)); if (!isNaN(k) && k - 1 !== at) go(k - 1); });
const h = parseInt((location.hash || "#1").slice(1)); at = isNaN(h) ? 0 : h - 1; render();
</script></body></html>
