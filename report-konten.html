 {t:"Daftar konten", html:() => `<div class="kicker">Daftar konten</div><h2>Semua konten</h2>
   <p class="sub">Filter per status atau campaign.</p>
   <div class="filters">${["Semua","Winning","Mediocre","Bad","Menunggu","Ditolak"].map(s => `<button data-st="${s}" class="${s === "Semua" ? "on" : ""}">${s}</button>`).join("")}
    <select id="fc">${["Semua", ...new Set(D.rows.map(x => x.camp))].map(c => `<option>${esc(c)}</option>`).join("")}</select></div>
   <div class="tbl"><table><thead><tr><th>Kode</th><th>Upload</th><th>Campaign</th><th>Produk</th><th>Template</th><th>Hook</th><th>Spend</th><th>Hasil</th><th>Biaya/hasil</th><th>Status</th></tr></thead>
   <tbody id="tb"></tbody></table></div>`},
 {t:"Insight", html:() => `<div class="kicker">Insight</div><h2>Yang terlihat dari data</h2>
   <p class="sub">Ringkasan temuan dari seluruh konten yang sudah dinilai.</p>
   <div class="list">${D.insights.map((i, n) => `<div class="item"><div class="no">${n + 1}</div><div>${i}</div></div>`).join("")}</div>`},
 {t:"Langkah berikutnya", html:() => `<div class="kicker">Rencana</div><h2>Langkah berikutnya</h2>
   <p class="sub">Tindak lanjut untuk batch konten berikutnya.</p>
   <div class="list">${D.next.map((i, n) => `<div class="item nx"><div class="no">${n + 1}</div><div>${esc(i)}</div></div>`).join("")}</div>
   <div class="sheetwrap"><a class="sheet" href="${esc(D.sheet)}" target="_blank" rel="noopener">Buka Content Tracker ↗</a></div>`},
];

let fSt = "Semua", fCamp = "Semua";
function fillTable(){ const el = $("#tb"); if (!el) return;
  el.innerHTML = D.rows.filter(x => (fSt === "Semua" || x.status === fSt) && (fCamp === "Semua" || x.camp === fCamp)).map(x =>
  `<tr><td style="white-space:nowrap"><b>${esc(x.code)}</b></td><td style="white-space:nowrap">${esc(x.dshort)}</td><td>${esc(x.camp)}</td><td>${esc(x.sku)}</td><td>${esc(x.template)}</td><td>${esc(x.hookType)}</td>
   <td class="num">${rp(x.spend)}</td><td class="num">${num(x.result)} <small style="color:var(--muted)">${esc(x.metric === "-" ? "" : x.metric)}</small></td>
   <td class="num">${rp(x.cpr)}</td><td>${x.status ? `<span class="st ${esc(x.status)}">${esc(x.status)}</span>` : `<span style="color:var(--muted)">organik</span>`}</td></tr>`).join("")
  || `<tr><td colspan="10" style="text-align:center;color:var(--muted)">Tidak ada konten</td></tr>`; }

const N = SL.length; let cur = 0;
$("#main").innerHTML = SL.map((s, i) => `<section class="s" id="s${i}">${s.html()}</section>`).join("");
$("#dots").innerHTML = SL.map((s, i) => `<button data-go="${i}">${i + 1} · ${s.t}</button>`).join("");
fillTable();
document.addEventListener("click", e => { const b = e.target.closest(".kfil button"); if (!b) return; const k = b.dataset.k, box = b.closest(".kfil").parentElement;
  box.querySelectorAll(".kfil button").forEach(x => x.classList.toggle("on", x === b)); box.querySelectorAll(".briefs .bf").forEach(c => c.style.display = c.dataset.k === k ? "" : "none"); });
document.querySelectorAll(".filters button").forEach(b => b.onclick = () => { fSt = b.dataset.st; document.querySelectorAll(".filters button").forEach(x => x.classList.toggle("on", x === b)); fillTable(); });
$("#fc").onchange = e => { fCamp = e.target.value; fillTable(); };
function go(i){ cur = Math.max(0, Math.min(N - 1, i));
  document.querySelectorAll(".s").forEach((el, j) => el.classList.toggle("on", j === cur));
  document.querySelectorAll("#dots button").forEach((b, j) => { b.classList.toggle("on", j === cur); b.classList.toggle("done", j < cur); });
  const on = $("#dots button.on"); on && on.scrollIntoView({inline:"center", block:"nearest"});
  $("#bar").style.width = ((cur + 1) / N * 100) + "%"; $("#count").textContent = `${cur + 1} / ${N}`;
  $("#prev").disabled = cur === 0; $("#next").disabled = cur === N - 1; history.replaceState(null, "", "#" + (cur + 1)); window.scrollTo({top:0, behavior:"instant"}); }
document.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if (g) return go(+g.dataset.go); if (e.target.id === "prev") go(cur - 1); if (e.target.id === "next") go(cur + 1); });
document.addEventListener("keydown", e => { if (e.target.tagName === "SELECT") return; if (e.key === "ArrowRight") go(cur + 1); if (e.key === "ArrowLeft") go(cur - 1); });
const h = parseInt((location.hash || "#1").slice(1)); go(isNaN(h) ? 0 : h - 1);
</script></body></html>
