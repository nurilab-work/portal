<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market Research Nurilab</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1F2A44;--ink:#1d2433;--muted:#6b7385;--line:#e6e9f0;--bg:#f6f7fa;--ll:#E8A317;--orange:#F26B1D;--up:#1E7B34;--down:#C0392B;--upbg:#E6F2E9;--downbg:#FBEAE8;--amber:#FFF7D6;--amberink:#6b5a12}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.6}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}.hr{display:flex;align-items:center;gap:16px}.fullwrap{margin-top:28px;text-align:center}.full{display:inline-block;background:#F26B1D;color:#fff;font-weight:700;font-size:17px;letter-spacing:.04em;text-decoration:none;padding:16px 34px;border-radius:999px;box-shadow:0 10px 24px rgba(242,107,29,.28)}.full:hover{background:#d95a12}.full:focus-visible{outline:3px solid rgba(242,107,29,.4);outline-offset:2px}.fullwrap p{margin:10px 0 0;font-size:13px;color:#7A7F8C}
header .back{color:#cfd4e0;font-size:13px;text-decoration:none;margin-top:2px}header .back:hover{color:#fff}
header .brand{font-weight:700;letter-spacing:.18em;font-size:11px;opacity:.75}
header h1{margin:2px 0 0;font-size:18px;font-weight:600}
.progress{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.bar{height:3px;background:var(--line)}.bar i{display:block;height:100%;background:var(--orange);transition:width .25s}
.dots{display:flex;gap:6px;padding:10px 20px;overflow-x:auto;scrollbar-width:none}
.dots button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:99px;height:30px;padding:0 11px;font:inherit;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.dots button.done{background:#f0f2f6;color:var(--navy);border-color:transparent}
.dots button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
main{max-width:900px;margin:0 auto;padding:26px 16px 110px}
.s{display:none}.s.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kicker{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h2{font-size:28px;line-height:1.25;margin:6px 0 6px;color:var(--navy)}
.sub{color:var(--muted);margin:0 0 20px;max-width:680px}
.hero{font-size:56px;font-weight:700;color:var(--navy);line-height:1.05;margin:8px 0 2px}
.hero small{font-size:20px;color:var(--muted);font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
.means{background:#fff;border-left:4px solid var(--orange);border-radius:0 12px 12px 0;padding:12px 16px;margin-top:18px;font-size:15px}
.means b{color:var(--navy)}
.g3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.ans .q{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ans .v{font-size:30px;font-weight:700;color:var(--navy);margin:4px 0}
.ans p{margin:0;font-size:14px;color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:34px 130px 1fr 88px;gap:10px;align-items:center;font-size:14px}
.logo{width:34px;height:34px;border-radius:9px;object-fit:cover;border:1px solid var(--line);background:#fff}
.row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm a{color:inherit;text-decoration:none}.row .nm a:hover{text-decoration:underline}
.track{height:24px;background:var(--bg);border-radius:6px;position:relative;overflow:visible}
.fill{height:100%;border-radius:6px;background:#c9ced8}
.row.me .fill{background:var(--ll)}.row.me .nm{color:#9a6a00}
.hist{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--navy);border-radius:2px}
.val{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.div{display:grid;grid-template-columns:34px 130px 1fr 70px;gap:10px;align-items:center;font-size:14px}
.dtrack{height:22px;position:relative;background:linear-gradient(90deg,transparent calc(50% - 1px),#d7dbe3 calc(50% - 1px),#d7dbe3 calc(50% + 1px),transparent calc(50% + 1px))}
.dfill{position:absolute;top:0;height:100%;border-radius:5px}
.pct{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.pct.up{color:var(--up)}.pct.down{color:var(--down)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vs .side{text-align:center}
.vs .side img{width:64px;height:64px;border-radius:16px;border:1px solid var(--line)}
.vs .side .n{font-weight:700;color:var(--navy);margin-top:6px}
.cmp{margin-top:14px}
.cmp .r{display:grid;grid-template-columns:1fr 150px 1fr;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-align:center}
.cmp .r .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.cmp .r .a,.cmp .r .b{font-size:20px;font-weight:700;color:var(--navy)}
.win{color:var(--up)!important}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big2 .card{text-align:center}.big2 .num{font-size:44px;font-weight:700;line-height:1.1}
.stack{height:38px;display:flex;border-radius:10px;overflow:hidden;margin:14px 0 8px}
.stack div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden}
.scen{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:baseline}
.scen .v{font-weight:700;color:var(--up);text-align:right}
.scen .d{grid-column:1/-1;font-size:13px;color:var(--muted);margin:-2px 0 10px}
.list h3{font-size:14px;margin:18px 0 8px;color:var(--navy);text-transform:uppercase;letter-spacing:.08em}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px 4px 4px;margin:0 6px 8px 0;text-decoration:none;color:var(--ink);font-size:13px;font-weight:500}
.chip img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.chip:hover{border-color:var(--navy)}
ul.m{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:6}
.nav .in{max-width:900px;margin:0 auto;display:flex;gap:10px;align-items:center;padding:12px 16px}
.nav .count{font-size:13px;color:var(--muted);margin-right:auto}
.btn{border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.btn.prev{background:var(--bg);color:var(--navy)}.btn.next{background:var(--navy);color:#fff}.btn:disabled{opacity:.35;cursor:default}
.ini{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#eef0f5;color:var(--navy);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pair{display:grid;grid-template-columns:34px 130px 1fr 54px;gap:10px;align-items:center;font-size:14px}
.pair .bb{display:flex;flex-direction:column;gap:4px}
.pair .b1,.pair .b2{height:13px;border-radius:4px;display:flex;align-items:center}
.pair .b1{background:#EE4D2D}.pair .b2{background:#1d2433}
.pair .ln{display:grid;grid-template-columns:1fr 64px;gap:6px;align-items:center}.pair .lab{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pair .rk{text-align:right;font-size:12px;font-weight:700;color:var(--navy);line-height:1.35}
.pair.me .nm{color:#9a6a00}
.trow{display:grid;grid-template-columns:34px 130px 1fr 80px 56px;gap:10px;align-items:center;font-size:14px}
.trow.me .fill{background:var(--ll)}.trow.me .nm{color:#9a6a00}
.tag{font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;text-align:center}
.tag.up{background:var(--upbg);color:var(--up)}.tag.down{background:var(--downbg);color:var(--down)}.tag.new{background:#E8EDF7;color:var(--navy)}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.two h3{font-size:13px;margin:0 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.two .big{font-size:30px;font-weight:700;color:var(--navy);line-height:1.1;margin-bottom:12px}
.chip.nolink{cursor:default}.chip .ini{width:26px;height:26px;border-radius:50%;font-size:9px}
@media (max-width:640px){.pair{grid-template-columns:28px 84px 1fr 44px;font-size:13px}.trow{grid-template-columns:28px 84px 1fr 64px 48px;font-size:13px}.ini{width:28px;height:28px}}
@media (max-width:640px){h2{font-size:22px}.hero{font-size:40px}.row,.div{grid-template-columns:28px 92px 1fr 64px;font-size:13px}.logo{width:28px;height:28px}.big2 .num{font-size:32px}.cmp .r{grid-template-columns:1fr 96px 1fr}.cmp .r .a,.cmp .r .b{font-size:16px}}
</style></head><body>

  ${means("awareness", mb ? (r === 1 ? `${esc(D.brand)} merek yang paling banyak dicari di kategorinya.` : `${esc(D.brand)} di posisi #${r}; ${esc(D.brands[0].name)} dicari <b>${(D.brands[0].v / mb.v).toFixed(1).replace(".", ",")}× lebih sering</b>. Penjualan masih bergantung pada iklan dan pencarian kategori, sehingga investasi awareness (TOFU) perlu dijaga.`) : "Merek klien belum tercatat pada data pencarian.")}`; }});
D.extra.forEach(x => SL.push({t:x.tab, html:() => `<div class="kicker">${esc(x.kicker)}</div><h2>${esc(x.title)}</h2>
  <div class="big2">${x.big.map(b => `<div class="card"><div class="kicker">${esc(b[0])}</div><div class="num" style="color:${b[2] === "down" ? "#C0392B" : "#1E7B34"}">${nf(b[1])}</div><div class="kicker">${esc(x.big_unit || "")}</div></div>`).join("")}</div>
  <div class="means"><b>Insight:</b> ${capH(x.insight)}</div>`}));
if (HAS_TT) {
  SL.push({t:"Shopee vs TikTok", html:() => { const c = comb().filter(x => x.tt > 0).slice(0, 5), m = Math.max(...c.map(x => Math.max(x.sh, x.tt)), 1);
   const eq = meT ? Math.round(ttTot * me.now / coreTot - meT.now) : 0;
   return `<div class="kicker">${esc(D.short[0])} · perbandingan channel</div><h2>Di TikTok Shop, ${esc(D.brand)} berada di posisi #${meT ? rankIn(ttCore, CL) : "–"}</h2>
   <p class="sub">Pasar ${esc(D.short[0].toLowerCase())} di TikTok (${jt(ttTot)}) dibandingkan Shopee (${jt(coreTot)}).</p>
   <div class="card"><div class="rows">${c.map(x => `<div class="pair ${x.name === CL ? "me" : ""}">${lg(x)}<div class="nm" style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.name)}</div><div class="bb"><div class="ln"><div><div class="b1" style="width:${x.sh / m * 100}%"></div></div><span class="lab">${jt(x.sh)}</span></div><div class="ln"><div><div class="b2" style="width:${x.tt / m * 100}%"></div></div><span class="lab">${jt(x.tt)}</span></div></div><div class="rk">#${rankIn(core, x.name) || "–"}<br>#${rankIn(ttCore, x.name) || "–"}</div></div>`).join("")}</div>
   <div class="legend"><span><i style="background:#EE4D2D"></i>Shopee</span><span><i style="background:#1d2433"></i>TikTok Shop</span><span>Kanan: peringkat Shopee / TikTok</span></div></div>
   ${means("channel", eq > 0 ? `jika pangsa pasar ${esc(D.brand)} di TikTok setara dengan Shopee (${pc(me.now / coreTot)}), terdapat potensi tambahan omzet ${esc(D.short[0].toLowerCase())} sebesar <b>±Rp${nf(eq)} jt/bulan</b>.` : `posisi ${esc(D.brand)} di TikTok sudah setara atau lebih kuat dibanding Shopee.`)}`; }});
  SL.push({t:"Kompetisi TikTok", html:() => { const l = byNow(ttCore).filter(s => s.now >= 5), m = l[0] ? l[0].now : 1, t2 = byNow(ttCore).slice(0, 2);
   const dn = [...ttCore].filter(s => s.prev && s.now >= 20).sort((a, b) => gr(a) - gr(b))[0];
   return `<div class="kicker">TikTok Shop · ${esc(D.arenas[0])}</div><h2>Peta kompetitor di TikTok Shop</h2><p class="sub">Omzet per brand dalam 30 hari. Label kanan menunjukkan perubahan dibandingkan 30 hari sebelumnya.</p>
   <div class="card"><div class="rows">${l.map(s => `<div class="trow ${s.name === CL ? "me" : ""}">${lg(s)}<div class="nm" style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.name)}</div><div class="track"><div class="fill" style="width:${s.now / m * 100}%"></div></div><div class="val">${jt(s.now)}</div>${tag(gr(s))}</div>`).join("")}</div></div>
   ${means("ttmap", `${t2.map(s => esc(s.name)).join(" dan ")} menguasai <b>${pc(sum(t2, "now") / ttTot)}</b> pasar.${dn && gr(dn) < -0.2 ? ` Omzet ${esc(dn.name)} turun ${pc(-gr(dn))}, membuka peluang akuisisi pembelinya.` : ""}`)}`; }});
  if (meT && rivT) SL.push({t:"Strategi TikTok", html:() => { const rows = [["Omzet " + D.short[0].toLowerCase() + " TikTok", jt(meT.now), jt(rivT.now), meT.now >= rivT.now ? "a" : "b"]];
   const ea = D.entry[CL], eb = D.entry[rivT.name];
   if (ea && eb) rows.push(["Harga produk satuan", "Rp" + nf(ea), "Rp" + nf(eb), ea <= eb ? "a" : "b"]);
   const afa = meT.own != null && meT.aff != null ? meT.aff / (meT.own + meT.aff) : null, afb = rivT.own != null && rivT.aff != null ? rivT.aff / (rivT.own + rivT.aff) : null;
   if (afa !== null && afb !== null) rows.push(["Omzet dari affiliate", pc(afa), pc(afb), afa >= afb ? "a" : "b"]);
   rows.push(["Kreator", nf(meT.kr), nf(rivT.kr), meT.kr >= rivT.kr ? "a" : "b"]);
   rows.push(["Porsi omzet dari video", pc(meT.vid / meT.now), pc(rivT.vid / rivT.now), meT.vid / meT.now >= rivT.vid / rivT.now ? "a" : "b"]);
   const gap = afa !== null && afb !== null && afb - afa > .2;
   return `<div class="kicker">TikTok Shop · head to head</div><h2>Strategi ${esc(rivT.name)} di TikTok Shop</h2>${vs({...meT, name:D.brand}, rivT, rows)}
   ${means("ttrival", gap ? `${esc(rivT.name)} mengandalkan affiliate (${pc(afb)} omzet) dengan ${nf(rivT.kr)} kreator, dibanding ${pc(afa)} dan ${nf(meT.kr)} kreator milik ${esc(D.brand)}. Perluasan jaringan kreator dan struktur komisi yang kompetitif menjadi <b>prioritas di TikTok Shop</b>.`
     : `${esc(D.brand)} ${meT.now >= rivT.now ? "memimpin" : "tertinggal"} dari ${esc(rivT.name)} di TikTok Shop; bandingkan harga, jaringan kreator, dan format video untuk menentukan langkah berikutnya.`)}`; }});
  const exp = D.arenas.map((a, i) => i).filter(i => i > 0 && T(i).length);
  if (exp.length) SL.push({t:"Ekspansi TikTok", html:() => { const mx = Math.max(...exp.flatMap(i => T(i).map(s => s.now)), 1);
   const row = s => `<div class="row">${lg(s)}<div class="nm">${esc(s.name)}</div><div class="track"><div class="fill" style="width:${s.now / mx * 100}%"></div></div><div class="val">${jt(s.now)}</div></div>`;
   const info = exp.map(i => { const l = T(i), t = sum(l, "now"), p = sum(l.filter(s => s.prev), "prev"), n = sum(l.filter(s => s.prev), "now"); return {i, t, g: p ? n / p - 1 : 0, l}; });
   return `<div class="kicker">TikTok Shop · kategori ekspansi</div><h2>Kategori ekspansi di TikTok Shop</h2><p class="sub">Kategori yang sama dengan analisis Shopee, dari sisi TikTok Shop.</p>
   <div class="two">${info.map(o => `<div class="card"><h3>${esc(D.short[o.i])}</h3><div class="big">${jt(o.t)} <span class="tag ${o.g >= 0 ? "up" : "down"}" style="font-size:13px;vertical-align:middle">${pct(o.g)}</span></div><div class="rows">${byNow(o.l).filter(s => s.now >= 5).slice(0, 7).map(row).join("")}</div></div>`).join("")}</div>
   ${means("ttexp", info.map(o => `${esc(D.short[o.i])} ${o.g >= 0 ? "tumbuh" : "terkoreksi"} ${pct(o.g)} di TikTok (${jt(o.t)}/bulan)`).join("; ") + ".")}`; }});
}
SL.push({t:"Proyeksi " + tgt, html:() => { const W = Math.max(D.target, proj);
  return `<div class="kicker">Skenario strategis · estimasi</div><h2>Roadmap menuju ${tgt} / bulan</h2><p class="sub">Run-rate saat ini ±Rp${nf(D.run)} jt, dengan selisih ±Rp${nf(Math.max(0, D.target - D.run))} jt dari target.</p>
  <div class="card"><div class="scen">${D.scen.map(s => `<div><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${s[3]};margin-right:8px"></i>${esc(s[0])}</div><div class="v">+Rp${nf(s[1])} jt</div><div class="d">${esc(s[2])}</div>`).join("")}</div>
  <div class="stack"><div style="width:${D.run / W * 100}%;background:#1F2A44">Saat ini Rp${nf(D.run)} jt</div>${D.scen.map(s => `<div style="width:${s[1] / W * 100}%;background:${s[3]}"></div>`).join("")}${proj < D.target ? `<div style="width:${(D.target - proj) / W * 100}%;background:#e6e9f0;color:#6b7385">sisa ${nf(D.target - proj)} jt</div>` : ""}</div>
  <p style="font-size:13px;color:var(--muted);margin:0">Proyeksi: <b>${jt(proj)}</b> (${pc(proj / D.target)} target).</p></div>
  ${means("scenario", proj >= D.target ? `kombinasi inisiatif di atas <b>melampaui target (${pc(proj / D.target)})</b> dan memberi ruang aman apabila salah satu inisiatif belum optimal.` : `skenario ini mencapai ${pc(proj / D.target)} target; dibutuhkan inisiatif tambahan sekitar <b>Rp${nf(D.target - proj)} jt/bulan</b>.`)}`; }});
SL.push({t:"Daftar toko", html:() => `<div class="kicker">Cakupan & metodologi</div><h2>Toko yang dipantau</h2><p class="sub">Toko yang dianalisis${HAS_TT ? " di Shopee dan TikTok Shop" : ""}. Klik nama toko untuk membuka halamannya di Shopee.</p>
  <div class="card list">${D.arenas.map((a, i) => A(i).length ? `<h3>${esc(a)}</h3>${byNow(A(i)).map(s => s.user ? `<a class="chip" href="${link(s.user)}" target="_blank" rel="noopener">${lg(s)}${esc(s.name)}</a>` : `<span class="chip nolink">${lg(s)}${esc(s.name)}</span>`).join("")}` : "").join("")}
  ${D.ttOnly.length ? `<h3>Tambahan dari TikTok</h3>${D.ttOnly.map(s => `<a class="chip" href="https://www.tiktok.com/@${esc(s.acc)}" target="_blank" rel="noopener">${lg(s)}${esc(s.name)}</a>`).join("")}` : ""}</div>
  <div class="card" style="margin-top:12px"><ul class="m"><li>Shopee: estimasi omzet 30 hari (${esc(D.pshopee)}). ${esc(D.calib)}</li>${HAS_TT ? `<li>TikTok Shop: estimasi omzet 30 hari (${esc(D.ptt)}), dijumlah per produk yang relevan.</li>` : ""}
  <li>Omzet kategori = hanya produk yang relevan per toko. Item hadiah/merchandise yang tidak dijual dikeluarkan.</li>
  <li>Tren Shopee dibandingkan rata-rata bulanan historis${HAS_TT ? "; tren TikTok dibandingkan 30 hari sebelumnya" : ""}.</li>
  ${D.notInTT.length ? `<li>Tidak memiliki toko aktif di TikTok Shop: ${D.notInTT.map(esc).join(", ")}.</li>` : ""}</ul></div>`});

const N = SL.length; let cur = 0;
$("#main").innerHTML = SL.map((s, i) => `<section class="s" id="s${i}">${s.html()}</section>`).join("");
$("#dots").innerHTML = SL.map((s, i) => `<button data-go="${i}">${i + 1} · ${esc(s.t)}</button>`).join("");
function go(i){ cur = Math.max(0, Math.min(N - 1, i));
  document.querySelectorAll(".s").forEach((el, j) => el.classList.toggle("on", j === cur));
  document.querySelectorAll("#dots button").forEach((b, j) => { b.classList.toggle("on", j === cur); b.classList.toggle("done", j < cur); });
  const on = $("#dots button.on"); on && on.scrollIntoView({inline:"center", block:"nearest"});
  $("#bar").style.width = ((cur + 1) / N * 100) + "%"; $("#count").textContent = `${cur + 1} / ${N}`;
  $("#prev").disabled = cur === 0; $("#next").disabled = cur === N - 1; history.replaceState(null, "", "#" + (cur + 1)); window.scrollTo({top:0, behavior:"instant"}); }
document.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if (g) return go(+g.dataset.go); if (e.target.id === "prev") go(cur - 1); if (e.target.id === "next") go(cur + 1); });
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") go(cur + 1); if (e.key === "ArrowLeft") go(cur - 1); });
const h = parseInt((location.hash || "#1").slice(1)); go(isNaN(h) ? 0 : h - 1);
</script></body></html>
