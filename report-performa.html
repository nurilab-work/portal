<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recap Performa · Nurilab</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1F2A44;--ink:#1d2433;--muted:#6b7385;--line:#e6e9f0;--bg:#f6f7fa;--orange:#F26B1D;--win:#1E7B34;--winbg:#E3F3E7;--med:#8A6100;--medbg:#FFF1CC;--bad:#C0392B;--badbg:#FBE0DD;
--shopee:#EE4D2D;--tiktok:#1d2433;--meta:#2a78d6;--tt2:#25b5b0}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.55}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
header .brand{font-weight:700;letter-spacing:.18em;font-size:11px;opacity:.75}
header h1{margin:2px 0 0;font-size:18px;font-weight:600}
header .r{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header a{color:#cfd4e0;font-size:13px;text-decoration:none}header a:hover{color:#fff}
header select{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:99px;padding:7px 14px;background:#fff;color:var(--navy);cursor:pointer}
.note{background:#FFF1CC;color:#6b5a12;font-size:12.5px;text-align:center;padding:7px 14px}
.progress{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.bar{height:3px;background:var(--line)}.bar i{display:block;height:100%;background:var(--orange);transition:width .25s}
.dots{display:flex;gap:6px;padding:10px 20px;overflow-x:auto;scrollbar-width:none}
.dots button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:99px;height:30px;padding:0 11px;font:inherit;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.dots button.done{background:#f0f2f6;color:var(--navy);border-color:transparent}
.dots button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
main{max-width:980px;margin:0 auto;padding:24px 16px 110px}
.s{display:none}.s.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kicker{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h2{font-size:27px;line-height:1.25;margin:6px 0 6px;color:var(--navy)}
.sub{color:var(--muted);margin:0 0 18px;max-width:720px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.means{background:#fff;border-left:4px solid var(--orange);border-radius:0;padding:12px 16px;margin-top:16px;font-size:15px}
.means b{color:var(--navy)}.means span{display:block}.means span+span{margin-top:5px}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,165px),1fr))}
.tile .l{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-size:clamp(20px,2.4vw,28px);white-space:nowrap;font-weight:700;color:var(--navy);line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .s2{font-size:12.5px;color:var(--muted)}
.dl{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;margin-left:4px}
.up{background:var(--winbg);color:var(--win)}.dn{background:var(--badbg);color:var(--bad)}.fl{background:#ECEEF2;color:var(--muted)}
.hint{display:inline-block;font-size:12px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:99px;padding:3px 12px;margin-top:10px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.ctrl select,.ctrl button{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;color:var(--ink);cursor:pointer}
.ctrl button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tog button{display:inline-flex;align-items:center;gap:7px;background:#fff!important;color:var(--muted)!important;border-color:var(--line)!important;opacity:.55}
.tog button.on{opacity:1;color:var(--ink)!important;border-color:var(--navy)!important;box-shadow:0 0 0 1px var(--navy) inset}
.tog button i.ln{display:inline-block;width:16px;height:3px;border-radius:2px}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin:0 0 6px}
.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.leg i.ln{height:3px;border-radius:2px;vertical-align:3px;width:16px}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.split .chart svg{max-width:250px;margin:0 auto}
.tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;font-size:12px;border-radius:8px;padding:7px 10px;white-space:nowrap;opacity:0;transition:opacity .1s;z-index:3}
.tip b{display:block;font-size:12px;margin-bottom:2px}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.1s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.grow{animation:gw .8s ease both}@keyframes gw{from{width:0}}
.pop{animation:pp .6s ease both}@keyframes pp{from{opacity:0;transform:scaleY(.2)}to{opacity:1;transform:none}}
.hb{display:grid;grid-template-columns:minmax(0,1.1fr) 2fr 120px;gap:12px;align-items:center;margin:12px 0;font-size:14px}
.hb .n{font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb .n small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.hb .tr{position:relative;height:26px;background:var(--bg);border-radius:7px}
.hb .fi{height:100%;border-radius:7px}
.hb .tr.two{height:32px;background:none}.hb .tr.two .fi{height:22px}.hb .lw{height:6px;margin-top:4px;border-radius:4px;background:#c9ced8}
.hb.tot{border-bottom:1px dashed var(--line);padding-bottom:12px}.hb.tot .n{font-size:15px}
.gapnote{font-size:12px;color:var(--muted);margin-top:6px}
.hb .mk{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--orange);border-radius:2px}
.hb .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}.hb .v small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:3px 11px}
.b-naik{background:var(--winbg);color:var(--win)}.b-tahan{background:var(--medbg);color:var(--med)}.b-turun{background:var(--badbg);color:var(--bad)}.b-na{background:#ECEEF2;color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:center}
.dleg{display:flex;flex-direction:column;gap:8px}
.dleg button{display:flex;justify-content:space-between;gap:10px;align-items:center;font:inherit;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;text-align:left}
.dleg button.on{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset}
.dleg button b{font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--navy);color:#fff;text-align:left;padding:9px 10px;font-weight:600;font-size:12px}
td{padding:9px 10px;border-top:1px solid var(--line)}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tblw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:16px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 16px;font-size:14.5px}
.item .no{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.item.nx .no{background:var(--orange)}
details{background:#fff;border:1px solid var(--line);border-radius:14px;margin-top:10px}
details summary{cursor:pointer;padding:12px 16px;font-weight:600;color:var(--navy);list-style:none}details summary::after{content:" ▾";color:var(--muted)}

.sheetwrap{margin-top:20px;text-align:center}
.sheet{display:inline-block;background:var(--orange);color:#fff;text-decoration:none;font-weight:700;font-size:15px;border-radius:99px;padding:13px 26px;box-shadow:0 10px 24px rgba(242,107,29,.25)}
.sheet:hover{background:#d95a12}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:6}
.nav .in{max-width:980px;margin:0 auto;display:flex;gap:10px;align-items:center;padding:12px 16px}
.nav .count{font-size:13px;color:var(--muted);margin-right:auto}
.btn{border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.btn.prev{background:var(--bg);color:var(--navy)}.btn.next{background:var(--navy);color:#fff}.btn:disabled{opacity:.35;cursor:default}

  if (o.band){ const a = X(o.band[0]) - (n > 1 ? (Wd - L - R) / (n - 1) / 2 : 0), b = X(o.band[1]) + (n > 1 ? (Wd - L - R) / (n - 1) / 2 : 0);
    s += `<rect x="${Math.max(L, a)}" y="${T}" width="${Math.min(Wd - R, b) - Math.max(L, a)}" height="${H - T - B}" fill="#F26B1D" opacity=".08"/>`; }
  const step = Math.ceil(n / (nar ? 5 : 9));
  o.labels.forEach((l, i) => { if (i % step === 0 || i === n - 1) s += `<text x="${X(i)}" y="${H - 12}" font-size="11" fill="#6b7385" text-anchor="middle">${esc(l)}</text>`; });
  (o.target || []).forEach(t => { if (isFinite(t.v)) s += `<line x1="${L}" x2="${Wd - R}" y1="${Y(t.v)}" y2="${Y(t.v)}" stroke="${t.c}" stroke-width="2" stroke-dasharray="6 5"/><text x="${Wd - R}" y="${Y(t.v) - 6}" font-size="11" fill="${t.c}" text-anchor="end" font-weight="600">${esc(t.n)}</text>`; });
  o.series.forEach((se, k) => { let d = "", pen = false; se.v.forEach((v, i) => { if (v == null || !isFinite(v)) { pen = false; return; } d += (pen ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1); pen = true; });
    s += se.dash ? `<path d="${d}" fill="none" stroke="${se.c}" stroke-width="${se.w || 2.4}" stroke-dasharray="7 6" stroke-linecap="round" class="pop"/>`
                 : `<path d="${d}" fill="none" stroke="${se.c}" stroke-width="${se.w || 2.4}" stroke-linejoin="round" stroke-linecap="round" pathLength="1" class="draw" style="animation-delay:${k * .12}s"/>`;
    if (se.dots) se.v.forEach((v, i) => { if (v != null && isFinite(v)) s += `<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${se.c}" stroke="#fff" stroke-width="2" class="pop" style="animation-delay:${.6 + i * .05}s"/>`; }); });
  s += `<line id="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="#1F2A44" stroke-width="1" opacity="0"/><rect x="${L}" y="${T}" width="${Wd - L - R}" height="${H - T - B}" fill="transparent" class="hov"/></svg><div class="tip"></div>`;
  el.innerHTML = s; const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), xh = el.querySelector("#xh");
  const move = e => { const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * Wd; let i = Math.round((px - L) / ((Wd - L - R) / Math.max(1, n - 1))); i = Math.max(0, Math.min(n - 1, i));
    xh.setAttribute("x1", X(i)); xh.setAttribute("x2", X(i)); xh.setAttribute("opacity", .35);
    tip.innerHTML = `<b>${esc(o.tips ? o.tips[i] : o.labels[i])}</b>` + o.series.map(se => `<span style="color:${se.tc || "#fff"}">●</span> ${esc(se.n)}: ${se.v[i] == null || !isFinite(se.v[i]) ? "–" : o.fmt(se.v[i], true)}`).join("<br>");
    tip.style.opacity = 1; const tx = X(i) / Wd * r.width; tip.style.left = Math.min(r.width - tip.offsetWidth - 4, Math.max(4, tx + 12)) + "px"; tip.style.top = "8px"; };
  svg.querySelector(".hov").addEventListener("mousemove", move); svg.querySelector(".hov").addEventListener("touchstart", e => move(e.touches[0]), {passive:true});
  svg.querySelector(".hov").addEventListener("mouseleave", () => { tip.style.opacity = 0; xh.setAttribute("opacity", 0); }); }

function comboChart(el, o){ const LC = o.lineC || "#F26B1D", nar = el.clientWidth < 560, Wd = nar ? 430 : 760, H = 270, L = 60, R = o.line ? 46 : 14, T = 14, B = 32, n = o.labels.length;

const N = SL.length; let at = 0;
function render(){ $("#main").innerHTML = SL.map((s, i) => `<section class="s" id="s${i}">${s.html()}</section>`).join("");
  $("#dots").innerHTML = SL.map((s, i) => `<button data-go="${i}">${i + 1} · ${s.t}</button>`).join(""); go(at, true); }
function go(i, keep){ at = Math.max(0, Math.min(N - 1, i));
  const sec = document.getElementById("s" + at); if (!keep) sec.innerHTML = SL[at].html();
  document.querySelectorAll(".s").forEach((el, j) => el.classList.toggle("on", j === at));
  if (SL[at].draw) SL[at].draw();
  document.querySelectorAll("#dots button").forEach((b, j) => { b.classList.toggle("on", j === at); b.classList.toggle("done", j < at); });
  const on = $("#dots button.on"); on && on.scrollIntoView({inline:"center", block:"nearest"});
  $("#bar").style.width = ((at + 1) / N * 100) + "%"; $("#count").textContent = `${at + 1} / ${N}`;
  $("#prev").disabled = at === 0; $("#next").disabled = at === N - 1; history.replaceState(null, "", "#" + (at + 1)); window.scrollTo({top:0, behavior:"instant"}); }
$("#wk").onchange = e => { wi = +e.target.value; render(); };
document.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if (g) return go(+g.dataset.go); if (e.target.id === "prev") go(at - 1); if (e.target.id === "next") go(at + 1); });
document.addEventListener("keydown", e => { if (e.target.tagName === "SELECT") return; if (e.key === "ArrowRight") go(at + 1); if (e.key === "ArrowLeft") go(at - 1); });
